<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ShokaX">
  <!--
    主题预设图示：brand.logo 的 ✨ 画成路径。
    不用 <text>✨</text>：emoji 靠系统字型，各平台长相不一，某些环境根本不渲染。
    颜色取自 palette.css 的 --color-pink（写死字面值：favicon 不在文件的 CSS 作用域内，
    读不到自订属性）。站点要换自己的图示，在 theme.config.ts 的 icons.favicon 指过去即可。
  -->
